[package]
name = "ws-rust-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }

axum = { version = "0.7", features = ["ws"] }
parking_lot = "0.12"
futures-util = "0.3"
dashmap = "6.0"
deadpool-redis = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros"] }
hex = "0.4.3"
